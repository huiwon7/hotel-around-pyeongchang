<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 | 호텔어라운드 평창</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-header">
        <h1>HOTEL AROUND</h1>
        <p>관리자 대시보드</p>
      </div>
      <form id="loginForm">
        <div class="login-field">
          <label for="adminPassword">관리자 비밀번호</label>
          <input type="password" id="adminPassword" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="login-btn">로그인</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard" style="display:none;">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <h1 class="logo">HOTEL AROUND <span>Admin</span></h1>
      </div>
      <div class="top-bar-right">
        <button class="btn-add-inquiry" id="btnAddInquiry">+ 문의 등록</button>
        <button class="btn-refresh" id="btnRefresh" title="새로고침">&#x21bb; 새로고침</button>
        <span class="last-updated" id="lastUpdated"></span>
        <button class="btn-logout" id="btnLogout">로그아웃</button>
      </div>
    </header>

    <!-- Stats Cards -->
    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">전체 문의</div>
      </div>
      <div class="stat-card today">
        <div class="stat-number" id="statToday">0</div>
        <div class="stat-label">오늘 접수</div>
      </div>
      <div class="stat-card week">
        <div class="stat-number" id="statWeek">0</div>
        <div class="stat-label">이번 주</div>
      </div>
      <div class="stat-card packages">
        <div class="stat-number" id="statPackage">-</div>
        <div class="stat-label">인기 패키지</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="filters-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="이름, 회사, 이메일 검색...">
      </div>
      <div class="filter-group">
        <select id="filterPackage">
          <option value="">전체 패키지</option>
          <option value="starter">Starter</option>
          <option value="professional">Professional</option>
          <option value="nomad">Nomad</option>
          <option value="paradise">Paradise</option>
          <option value="custom">기업 맞춤</option>
        </select>
        <select id="filterStatus">
          <option value="">전체 상태</option>
          <option value="pending">신규</option>
          <option value="consulting">상담중</option>
          <option value="hold">보류</option>
          <option value="confirmed">예약완료</option>
        </select>
        <select id="filterPeriod">
          <option value="">전체 기간</option>
          <option value="today">오늘</option>
          <option value="week">이번 주</option>
          <option value="month">이번 달</option>
        </select>
      </div>
    </section>

    <!-- Table -->
    <section class="table-section">
      <div class="table-wrapper">
        <table class="inquiry-table">
          <thead>
            <tr>
              <th>접수일시</th>
              <th>이름</th>
              <th>회사</th>
              <th>패키지</th>
              <th>진행상태</th>
              <th>연락처</th>
              <th>체크인</th>
              <th>인원</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody id="inquiryBody">
            <tr>
              <td colspan="9" class="empty-state">
                <div class="empty-icon">&#128203;</div>
                <p>데이터를 불러오는 중...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Add Inquiry Modal -->
    <div class="modal-overlay" id="addModal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>문의 수동 등록</h2>
          <button class="modal-close" id="addModalClose">&times;</button>
        </div>
        <div class="modal-body">
          <form id="addInquiryForm">
            <div class="add-form-row">
              <div class="add-form-group">
                <label>이름 *</label>
                <input type="text" name="name" required placeholder="홍길동">
              </div>
              <div class="add-form-group">
                <label>회사/소속</label>
                <input type="text" name="company" placeholder="회사명">
              </div>
            </div>
            <div class="add-form-row">
              <div class="add-form-group">
                <label>이메일 *</label>
                <input type="email" name="email" required placeholder="email@example.com">
              </div>
              <div class="add-form-group">
                <label>연락처 *</label>
                <input type="tel" name="phone" required placeholder="010-0000-0000">
              </div>
            </div>
            <div class="add-form-row">
              <div class="add-form-group">
                <label>패키지</label>
                <select name="package">
                  <option value="">선택</option>
                  <option value="starter">Starter - 7박</option>
                  <option value="professional">Professional - 14박</option>
                  <option value="nomad">Nomad - 30박</option>
                  <option value="paradise">Paradise - 90박</option>
                  <option value="custom">기업 맞춤</option>
                </select>
              </div>
              <div class="add-form-group">
                <label>인원</label>
                <select name="guests">
                  <option value="1">1명</option>
                  <option value="2">2명</option>
                  <option value="3-5">3~5명</option>
                  <option value="6-10">6~10명</option>
                  <option value="10+">10명 이상</option>
                </select>
              </div>
            </div>
            <div class="add-form-group" style="width:100%;">
              <label>희망 체크인</label>
              <input type="date" name="checkin">
            </div>
            <div class="add-form-group" style="width:100%;">
              <label>메시지</label>
              <textarea name="message" rows="3" placeholder="문의 내용"></textarea>
            </div>
            <button type="submit" class="btn-add-submit">등록</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>문의 상세</h2>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="admin-footer">
      <span>&copy; 2025 Hotel Around Pyeongchang - Admin</span>
    </footer>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
