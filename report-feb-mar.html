<script type="text/babel">
const {useState, useEffect, useRef} = React;

/* ── Reusable Components ── */

const Chevron = ({open}) => (
  <svg className={`chevron w-5 h-5 text-slate-400 ${open?'open':''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/>
  </svg>
);

const Accordion = ({id, icon, title, badge, badgeColor='bg-blue-100 text-blue-700', children, defaultOpen=false}) => {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <section className="mb-3" id={id}>
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between bg-white rounded-2xl px-5 py-4 shadow-sm active:scale-[0.99] transition-transform">
        <div className="flex items-center gap-3">
          <span className="text-xl">{icon}</span>
          <div className="text-left">
            <h2 className="text-[15px] font-bold leading-tight">{title}</h2>
            {badge && <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full mt-1 inline-block ${badgeColor}`}>{badge}</span>}
          </div>
        </div>
        <Chevron open={open}/>
      </button>
      <div className={`accordion-body ${open?'open':''}`}>
        <div className="px-4 pt-3 pb-1 fade-in">{children}</div>
      </div>
    </section>
  );
};

const KPI = ({label, value, sub, color='border-l-blue-500'}) => (
  <div className={`bg-white rounded-xl p-3.5 ${color} border-l-4 shadow-sm`}>
    <p className="text-[10px] text-slate-400 font-semibold">{label}</p>
    <p className="text-[20px] font-black">{value}</p>
    {sub && <p className="text-[10px] text-slate-400 mt-0.5">{sub}</p>}
  </div>
);

const ProbBar = ({label, pct}) => {
  const barColor = pct >= 80 ? 'bg-emerald-500' : pct >= 50 ? 'bg-blue-500' : pct >= 10 ? 'bg-amber-500' : 'bg-red-400';
  return (
    <div className="mb-3">
      <div className="flex justify-between items-center mb-1">
        <span className="text-[11px] text-slate-600">{label}</span>
        <span className="text-[12px] font-bold">{pct > 0 ? pct+'%' : '\u2248 0%'}</span>
      </div>
      <div className="bg-slate-200 rounded-full h-2">
        <div className={`${barColor} rounded-full h-2`} style={{width: `${Math.max(pct, 1.5)}%`}}/>
      </div>
    </div>
  );
};

const ChartCanvas = ({configFn, height='h-52'}) => {
  const ref = useRef(null);
  const chartInst = useRef(null);
  useEffect(() => {
    if (!ref.current || typeof Chart === 'undefined') return;
    if (chartInst.current) chartInst.current.destroy();
    chartInst.current = new Chart(ref.current, configFn());
    return () => { if (chartInst.current) chartInst.current.destroy(); };
  }, []);
  return (
    <div className={`bg-white rounded-xl p-4 shadow-sm mb-3`}>
      <div className={height}><canvas ref={ref}/></div>
    </div>
  );
};

        </Accordion>

        {/* ── SECTION 7: 방법론 ── */}
        <Accordion id="method" icon="🔬" title="분석 방법론" badge="METHODOLOGY" badgeColor="bg-slate-200 text-slate-600">

          <p className="text-[11px] text-slate-600 mb-3">확률 분포 모델링 + Monte Carlo 시뮬레이션(N=100,000)을 결합하여 매출 추정. 신뢰구간(CI) 및 목표 달성 확률 산출.</p>

          <h4 className="text-[12px] font-bold text-slate-500 mb-2">확률 분포 모델</h4>
          {[
            {name:'가동률 (OCC)', dist:'Beta Distribution', reason:'OCC \u2208 [0,1] → 유계 확률변수에 적합', icon:'📊',
             formula:'f(x; α, β) = x^(α-1)(1-x)^(β-1) / B(α, β)'},
            {name:'객실단가 (ADR)', dist:'Log-Normal Distribution', reason:'ADR > 0, 우측 꼬리 분포 → LogNormal 적합', icon:'💰',
             formula:'ln(ADR) ~ N(μ_ln, σ_ln²)'},
            {name:'계절 감쇠 (3월)', dist:'Exponential Decay', reason:'스키 시즌 종료(3/15이후) 수요 감소 반영', icon:'📉',
             formula:'f(d) = exp(-0.02 × (d-15)), d > 15'},
          ].map((item,i) => (
            <div key={i} className="bg-white rounded-xl p-3.5 mb-2 shadow-sm border-l-4 border-l-slate-300">
              <p className="text-[13px] font-bold">{item.icon} {item.name}</p>
              <p className="text-[11px] text-blue-600 font-semibold">{item.dist}</p>
              <p className="text-[10px] text-slate-400 mb-1.5">{item.reason}</p>
              <div className="bg-slate-50 rounded-lg px-3 py-1.5">
                <p className="text-[10px] font-mono text-slate-600">{item.formula}</p>
              </div>
            </div>
          ))}

          <h4 className="text-[12px] font-bold text-slate-500 mt-3 mb-2">추정 모수 요약</h4>
          <div className="bg-white rounded-xl p-3.5 shadow-sm mb-3">
            <div className="grid grid-cols-2 gap-3">
              <div>
                <p className="text-[10px] font-bold text-blue-600 mb-1.5">2월 잔여 (10일)</p>
                <p className="text-[10px] text-slate-600 mb-0.5">평일 OCC: Beta(12.25, 19.53)</p>
                <p className="text-[10px] text-slate-600 mb-0.5">주말 OCC: Beta(12.78, 11.09)</p>
                <p className="text-[10px] text-slate-600 mb-0.5">ADR: LogN(11.59, 0.163)</p>
                <p className="text-[10px] text-slate-600">F&B/Room: N(12,000, 3,000²)</p>
              </div>
              <div>
                <p className="text-[10px] font-bold text-amber-600 mb-1.5">3월 (31일)</p>
                <p className="text-[10px] text-slate-600 mb-0.5">평일 OCC: Beta(5.53, 49.73)</p>
                <p className="text-[10px] text-slate-600 mb-0.5">주말 OCC: Beta(6.97, 14.14)</p>
                <p className="text-[10px] text-slate-600 mb-0.5">ADR: LogN(11.45, 0.157)</p>
                <p className="text-[10px] text-slate-600">F&B/Room: N(13,000, 3,000²)</p>
              </div>
            </div>
          </div>

          <h4 className="text-[12px] font-bold text-slate-500 mb-2">MC 일별 매출 생성 프로세스</h4>
          <div className="bg-slate-800 text-slate-200 rounded-xl p-3.5 mb-3 font-mono text-[10px] leading-relaxed">
            <p className="text-blue-300 mb-1">// For each simulation n = 1,...,100,000</p>
            <p>For each day d = 1, ..., D:</p>
            <p className="pl-3">1) OCC_d ~ Beta(α_type, β_type)</p>
            <p className="pl-3">2) Rooms_d = ⌊OCC_d × 350⌋</p>
            <p className="pl-3">3) ADR_d ~ LogNormal(μ_ln, σ_ln)</p>
            <p className="pl-3">4) Rev_d = Rooms_d × ADR_d</p>
            <p className="mt-1.5 text-emerald-300">Monthly Rev = Σ Rev_d</p>
            <p className="text-emerald-300">F&B = Σ Rooms_d × FnB_per_room</p>
          </div>

          <h4 className="text-[12px] font-bold text-slate-500 mb-2">3월 계절 감쇠 함수</h4>
          <div className="bg-white rounded-xl p-3.5 shadow-sm mb-3">
            <div className="bg-slate-50 rounded-lg p-2.5 font-mono text-[10px] text-slate-700 mb-2">
              <p>f(d) = 1.0 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; if d ≤ 15</p>
              <p>f(d) = exp(-0.02×(d-15)) &nbsp; if d {'>'} 15</p>
              <p className="mt-1 text-slate-400">OCC_adjusted = OCC_base × f(d)</p>
            </div>
            <div className="flex justify-between text-[10px]">
              {[{d:'3/1',v:'1.000'},{d:'3/10',v:'1.000'},{d:'3/15',v:'1.000'},{d:'3/20',v:'0.905'},{d:'3/25',v:'0.819'},{d:'3/31',v:'0.726'}].map((item,i) => (

          ].map((item,i) => (
            <div key={i} className="flex items-center gap-3 bg-white rounded-lg p-2.5 mb-1.5 shadow-sm">
              <p className="text-[11px] font-bold w-16 flex-shrink-0">{item.date}</p>
              <p className="text-[11px] flex-1">{item.rooms} / {item.occ}</p>
              <span className={`text-[9px] font-semibold px-2 py-0.5 rounded-full flex-shrink-0 ${item.badge}`}>{item.type}</span>
            </div>
          ))}

          <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 mt-3 mb-1">
            <p className="text-[11px] text-blue-800">
              <strong>분포 적합 전략:</strong> 비연휴 평일/주말 데이터를 분리하여 Beta 분포 적합. 설 연휴 데이터는 잔여 기간 추정에서 제외하되, 18일 실적에 이미 반영됨. 제한된 표본(n=2~3)의 한계를 보완하기 위해 분산에 보수적 가정 적용.
            </p>
          </div>

          {/* 월별 실적 현황 */}
          <h4 className="text-[12px] font-bold text-slate-500 mt-4 mb-2">월별 실적 현황</h4>
          {[
            {m:'11월', rooms:'453실', occ:'3.7%', adr:'106,572', rev:'4,828만', fnb:'-'},
            {m:'12월', rooms:'2,680실', occ:'23.8%', adr:'139,215', rev:'3.73억', fnb:'4,973만'},
            {m:'1월', rooms:'5,563실', occ:'52.9%', adr:'111,237', rev:'6.19억', fnb:'8,800만', highlight:true},
            {m:'2월(~18일)', rooms:'4,741실', occ:'48.5%*', adr:'124,405', rev:'5.90억', fnb:'5,519만'},
            {m:'3월(사전)', rooms:'243실', occ:'2.2%', adr:'93,995', rev:'2,284만', fnb:'-'},
          ].map((item,i) => (
            <div key={i} className={`bg-white rounded-xl p-3 mb-1.5 shadow-sm ${item.highlight?'border-l-4 border-l-emerald-500':''}`}>
              <div className="flex justify-between items-center mb-1">
                <p className="text-[12px] font-bold">{item.m}</p>
                <span className="text-[10px] text-slate-400">{item.rooms} · OCC {item.occ}</span>

              <div className="flex justify-between text-[11px]">

          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 mt-2 mb-1">
            <p className="text-[10px] text-amber-700">
              * 2월 OCC 48.5%는 28일 분모 기준. 실제 18일간 일평균 가동률 = <strong>75.3%</strong> (설 연휴 포함).
            </p>
          </div>
        </Accordion>

      </div>

      {/* ===== FOOTER ===== */}
      <footer className="bg-blue-950 text-white text-center py-8 px-6 mt-4">
        <p className="text-[10px] text-blue-300 tracking-widest mb-1">HOTEL AROUND PYEONGCHANG</p>

    </div>
  );
